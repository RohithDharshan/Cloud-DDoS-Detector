services:
  ddos-detector:
    build: .
    container_name: ddos-detector
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
